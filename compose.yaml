name: postgresify

networks:
  isolated:
    driver: bridge
    internal: true

services:
  adminer:
    depends_on:
      postgres:
        condition: service_started
    env_file:
      - path: .env
        required: true
    image: adminer:5.5.0
    networks:
      - isolated
    ports:
      - ${ADMINER_PORT:-8080}:8080
    deploy:
      resources:
        limits:
          cpus: 1.0
          memory: 1G
        reservations:
          cpus: 0.5
          memory: 500M
    restart: unless-stopped
    stdin_open: false
    tty: false

  postgres:
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
    image: postgres:18.4
    networks:
      - isolated
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    deploy:
      resources:
        limits:
          cpus: 1.0
          memory: 1G
        reservations:
          cpus: 0.5
          memory: 500M
    restart: unless-stopped
    stdin_open: false
    tty: false
    volumes:
      - source: pgdata
        target: /var/lib/postgresql/18/docker/
        type: volume

volumes:
  pgdata:
    driver: local
