name: postgresify

networks:
  isolated:
    driver: bridge
    internal: true

services:
  pgAdmin:
    container_name: pgadmin4
    depends_on:
      postgres:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 1G
        reservations:
          cpus: 0.5
          memory: 500M
    env_file:
      - path: .env
        required: true
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?}
    image: dpage/pgadmin4:9.17
    networks:
      - isolated
    ports:
      - ${PGADMIN_PORT:-8080}:80
    restart: unless-stopped
    stdin_open: false
    tty: false

  postgres:
    container_name: postgres18
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 1G
        reservations:
          cpus: 0.5
          memory: 500M
    env_file:
      - path: .env
        required: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
    image: postgres:18.4
    networks:
      - isolated
    ports:
      - ${POSTGRES_PORT:-5432}:5432
    restart: unless-stopped
    stdin_open: false
    tty: false
    volumes:
      - source: pgdata
        target: /var/lib/postgresql/18/docker/
        type: volume

volumes:
  pgdata:
    driver: local
